name: Build Android ARM64 APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version label
        required: true
        default: "1.4.9"
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: clear
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install official Android build dependencies
        run: |
          sudo apt-get update
          # gcc/g++ multilib are host build-script dependencies from the official workflow;
          # they do not change the ARM64 Android target ABI.
          sudo apt-get install -y \
            clang cmake curl gcc-multilib g++ g++-multilib git libayatana-appindicator3-dev \
            libasound2-dev libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Apply Windows mTLS patch
        run: |
          git -C libs/hbb_common apply --check ../../.github/patches/hbb_common_windows_mtls.diff
          git -C libs/hbb_common apply ../../.github/patches/hbb_common_windows_mtls.diff

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: false

      - name: Patch Flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: true

      - name: Validate NDK environment and build native dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          test "$ANDROID_NDK_HOME" = "$ANDROID_NDK_ROOT"
          test "$ANDROID_NDK_HOME" = "$ANDROID_NDK"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75
          targets: aarch64-linux-android
          components: rustfmt

      - name: Build ARM64 Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          test "$ANDROID_NDK_HOME" = "$ANDROID_NDK_ROOT"
          test "$ANDROID_NDK_HOME" = "$ANDROID_NDK"
          cargo install cargo-ndk --version 3.1.2 --locked
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build ARM64 release APK
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          pushd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../rustdesk-${{ inputs.version }}-android-arm64.apk

      - name: Verify APK ABI
        run: |
          unzip -l rustdesk-${{ inputs.version }}-android-arm64.apk | grep 'lib/arm64-v8a/'
          if unzip -l rustdesk-${{ inputs.version }}-android-arm64.apk | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 native library in APK" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-${{ inputs.version }}-android-arm64
          path: rustdesk-${{ inputs.version }}-android-arm64.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
